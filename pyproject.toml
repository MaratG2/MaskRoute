[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maskroute"
version = "0.1.0"
description = "Experimental typed disclosure boundary for mediated LLM workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2"]
comparison = ["piighost==2.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "baseline", "examples", "benchmarks", "tests"]

[[tool.mypy.overrides]]
module = ["piighost.*"]
ignore_missing_imports = true

